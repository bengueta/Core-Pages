name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm run build:pages

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true

      - name: Enable GitHub Pages (gh-pages branch)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const source = { branch: "gh-pages", path: "/" };

            try {
              await github.rest.repos.createPagesSite({
                owner,
                repo,
                build_type: "legacy",
                source,
              });
              core.info("Created GitHub Pages site (gh-pages /).");
            } catch (error) {
              if (error.status === 409) {
                await github.rest.repos.updateInformationAboutPagesSite({
                  owner,
                  repo,
                  build_type: "legacy",
                  source,
                });
                core.info("Updated GitHub Pages site (gh-pages /).");
              } else {
                throw error;
              }
            }

            await github.rest.repos.requestPagesBuild({ owner, repo });
            core.info("Requested Pages rebuild.");
