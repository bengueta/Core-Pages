# EXAMPLE — install in github.com/bengueta/Core-Pages/.github/workflows/process-pages.yml
#
# A2 pipeline: a public user publishes a page via the builder, which opens a
# prefilled GitHub Discussion in the "Pages" category. This workflow turns that
# Discussion into a static block page (validated + sanitized) and commits it;
# the existing deploy-pages workflow then rebuilds the site.
#
# 100% GitHub-native: GitHub login + Discussions (publish) + Actions (build). No
# external server, no secret. Users never get write access — the Action commits
# with the repo's own token after sanitizing the untrusted input.
#
# Setup: enable Discussions, create a category named "Pages" (slug: pages).

name: Publish Vault page from Discussion

on:
  discussion:
    types: [created, edited]

permissions:
  contents: write

concurrency:
  group: vault-pages-${{ github.event.discussion.number }}
  cancel-in-progress: true

jobs:
  build-page:
    # only process submissions in the dedicated "Pages" category
    if: github.event.discussion.category.slug == 'pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate page from discussion
        env:
          DISCUSSION_NUMBER: ${{ github.event.discussion.number }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          DISCUSSION_BODY: ${{ github.event.discussion.body }}
          DISCUSSION_AUTHOR: ${{ github.event.discussion.user.login }}
        run: node vault/scripts/discussion-to-page.mjs
      - name: Commit page (triggers the Pages deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vault/src/content/pages/
          if git diff --cached --quiet; then
            echo "No page change."
          else
            git commit -m "Publish Vault page from discussion #${{ github.event.discussion.number }}"
            git push
          fi
